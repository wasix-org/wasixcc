name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    # Run on tag pushes, OR PRs where the source branch is release/*
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag or branch
        id: extract
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            # --- Pull Request Logic ---
            # Get version from the source branch name (e.g., release/0.2.5)
            if [ -z "$GITHUB_HEAD_REF" ]; then
              echo "ERROR: GITHUB_HEAD_REF is empty"
              exit 1
            fi

            BRANCH="${GITHUB_HEAD_REF}"
            
            # Ensure branch matches release/*
            if [[ ! "$BRANCH" =~ ^release/ ]]; then
              echo "ERROR: Branch name must match 'release/*' (e.g., release/0.2.5)"
              exit 1
            fi

            # Extract version by removing 'release/' prefix
            VERSION="${BRANCH#release/}"
            echo "Extracted version from PR branch: $VERSION"

          else
            # --- Tag Logic ---
            # Get the tag name from the ref
            if [ -z "$GITHUB_REF" ]; then
              echo "ERROR: GITHUB_REF is empty"
              exit 1
            fi

            # Check if this is a tag reference
            if [[ ! "$GITHUB_REF" =~ refs/tags/ ]]; then
              echo "ERROR: This workflow must be triggered by a tag push (refs/tags/v*)"
              echo "Current GITHUB_REF: $GITHUB_REF"
              exit 1
            fi

            TAG="${GITHUB_REF#refs/tags/}"
            
            # Verify tag starts with 'v' and follows semantic versioning
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "ERROR: Tag must be in the format 'vX.Y.Z' (e.g., v0.2.5)"
              echo "Current tag: $TAG"
              exit 1
            fi

            # Remove 'v' prefix to get version
            VERSION="${TAG#v}"
            echo "Extracted version from tag: $VERSION"
          fi

          # --- Common Validation ---
          # Ensure the extracted version is valid semantic versioning (X.Y.Z)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Extracted version '$VERSION' is not valid (format X.Y.Z)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Cargo.toml version
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          CARGO_VERSION=$(grep -E '^\s*version\s*=\s*' Cargo.toml | head -1 | sed -E 's/.*=\s*['"'"'"]([^'"'"'"]+)['"'"'"].*/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match extracted version ($VERSION)"
            exit 1
          fi
          echo "✓ Cargo.toml version matches"

      - name: Verify wasmer.toml version
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          WASMER_VERSION=$(grep -E '^\s*version\s*=\s*' wasmer.toml | head -1 | sed -E 's/.*=\s*['"'"'"]([^'"'"'"]+)['"'"'"].*/\1/')
          echo "wasmer.toml version: $WASMER_VERSION"

          if [ "$WASMER_VERSION" != "$VERSION" ]; then
            echo "ERROR: wasmer.toml version ($WASMER_VERSION) does not match extracted version ($VERSION)"
            exit 1
          fi
          echo "✓ wasmer.toml version matches"

      - name: Verify install.sh version
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          INSTALL_VERSION=$(grep -E '^\s*VERSION\s*=\s*' installer/public/install.sh | head -1 | sed -E 's/.*=\s*['"'"'"]([^'"'"'"]+)['"'"'"].*/\1/')
          echo "install.sh version: $INSTALL_VERSION"

          if [ "$INSTALL_VERSION" != "$VERSION" ]; then
            echo "ERROR: install.sh version ($INSTALL_VERSION) does not match extracted version ($VERSION)"
            exit 1
          fi
          echo "✓ install.sh version matches"

      - name: Version verification complete
        run: |
          echo "✓ All version checks passed for version ${{ steps.extract.outputs.version }}"

  build:
    needs: verify-version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Do NOT run on Pull Requests
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        if: matrix.cross
        uses: cargo-bins/cargo-binstall@main

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          cargo binstall --no-confirm cross

      - name: Build binary (cross)
        if: matrix.cross
        run: |
          TARGET=$(echo "${{ matrix.target }}" | sed 's/gnu/musl/g')
          RUSTFLAGS="-C target-feature=+crt-static" cross build --release --target "$TARGET"
          mv target/$TARGET tmp
          mv tmp target/${{ matrix.target }}

      - name: Build binary (cargo)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf wasixcc-${{ matrix.target }}.tar.gz wasixccenv
          mv wasixcc-${{ matrix.target }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasixcc-${{ matrix.target }}
          path: wasixcc-${{ matrix.target }}.tar.gz

  publish-crates-io:
    name: Publish to crates.io
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    # Do NOT run on Pull Requests
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          echo "Publishing wasixcc version ${{ needs.verify-version.outputs.version }} to crates.io"
          cargo publish

  release:
    name: Create Release
    needs: [build, publish-crates-io]
    runs-on: ubuntu-latest
    # Do NOT run on Pull Requests
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root
        run: |
          find artifacts -name '*.tar.gz' -exec mv {} . \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wasixcc-*.tar.gz
          draft: true
          prerelease: false
          generate_release_notes: true
